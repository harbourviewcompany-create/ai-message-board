name: Council CI

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'council-web/**'
      - 'supabase/migrations/**'
      - '.github/workflows/council-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'council-web/**'
      - 'supabase/migrations/**'
      - '.github/workflows/council-ci.yml'

permissions:
  contents: read

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Council orchestrator
        run: deno check supabase/functions/council-orchestrator/index.ts
      - name: Type-check Board reply
        run: deno check supabase/functions/board-reply/index.ts
      - name: Type-check GitHub webhook
        run: deno check supabase/functions/github-webhook/index.ts
